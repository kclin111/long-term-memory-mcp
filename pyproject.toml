[project]
name = "long-term-memory-mcp"
version = "0.1.0"
description = "Local-first event-centric long-term memory MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "long-term-memory-mcp contributors" }
]
dependencies = [
  "mcp>=1.27.0",
  "lancedb>=0.30.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[project.scripts]
ltm-memory = "ltm_memory.cli:main"
ltm-memory-mcp = "ltm_memory.mcp_server:main"
ltm-memory-smoke = "ltm_memory.install_smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltm_memory"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ltm_memory",
  "tests",
  "benchmarks",
  "docs",
  "README.md",
  "pyproject.toml",
  ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
